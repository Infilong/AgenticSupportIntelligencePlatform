name: asi-release-v1
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: asi_rebuild
      POSTGRES_USER: asi_rebuild
      POSTGRES_PASSWORD: ${ASI_RELEASE_DATABASE_PASSWORD:?Initialize release credentials}
    volumes:
      - release_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asi_rebuild -d asi_rebuild"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: asi-release-v1-app
    build:
      context: ..
      dockerfile: infra/Dockerfile.release
    environment: &application
      ASI_DATABASE_URL: postgresql+psycopg://asi_rebuild:${ASI_RELEASE_DATABASE_PASSWORD:?Initialize release credentials}@postgres:5432/asi_rebuild
      ASI_PROVIDER_MODE: mock
      ASI_EMBEDDING_CACHE: /home/workbench/models
      ASI_ALLOWED_ORIGINS: '["http://127.0.0.1:8011","http://localhost:8011"]'
    volumes:
      - release_models:/home/workbench/models
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 12
  worker:
    image: asi-release-v1-app
    command: ["uv", "run", "--frozen", "python", "-m", "app.worker"]
    environment: *application
    volumes:
      - release_models:/home/workbench/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "python", "-m", "app.worker", "--health"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  release_database:
  release_models:
