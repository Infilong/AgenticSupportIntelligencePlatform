name: Verify
on:
  push:
    branches: ["codex/fresh-start"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and migrate isolated release
        run: python scripts/manage.py release-up
      - name: Seed disposable CI identities
        run: python scripts/manage.py release-seed
      - name: Verify built assets and protected worker journey
        run: npx playwright test tests/e2e/release.spec.ts
        working-directory: frontend
        env:
          ASI_EVIDENCE_DIR: ../.artifacts/m6/ci-release-browser
      - name: Release failure diagnostics
        if: failure()
        run: |
          if [ -f .artifacts/m6/release.env ]; then
            docker compose --env-file .artifacts/m6/release.env -f infra/compose.release.yaml -p asi-release-v1 logs --tail 80 api worker postgres
          fi
      - name: Stop isolated release and preserve volumes
        if: always()
        run: |
          if [ -f .artifacts/m6/release.env ]; then
            python scripts/manage.py release-down
          fi
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - run: python scripts/manage.py init-env
      - run: python scripts/manage.py up
      - run: python scripts/manage.py seed-demo
      - run: python scripts/manage.py verify-worker
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:app
        working-directory: frontend
        env:
          ASI_EVIDENCE_DIR: ../.artifacts/m1/ci-browser
      - if: failure()
        run: docker compose -p asi-rebuild-v1 logs --tail 80 api frontend worker
      - if: always()
        run: python scripts/manage.py down
  preparation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Preparation and documentation regressions
        run: python scripts/manage.py verify-prep
      - name: Generated documentation and reviewed source fingerprints
        run: python scripts/docs_freshness.py check
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: asi_rebuild_test
          POSTGRES_USER: asi_rebuild
          POSTGRES_PASSWORD: ci-test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asi_rebuild -d asi_rebuild_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.3
      - run: uv sync --project backend --frozen
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend ruff format --check backend
      - run: python scripts/manage.py verify-backend
      - name: Real PostgreSQL session and workspace regressions
        working-directory: backend
        env:
          ASI_TEST_DATABASE_URL: postgresql+psycopg://asi_rebuild:ci-test-only-password@127.0.0.1:5432/asi_rebuild_test
        run: uv run --frozen pytest tests/integration -q --tb=short
